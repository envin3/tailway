name: tailscale-exit-policy-router

services:
  gateway-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        TAILSCALE_VERSION: ${TAILSCALE_VERSION:-1.102.1}
    image: local/tailscale-exit-policy-router-agent:${IMAGE_TAG:-dev}
    pull_policy: never
    container_name: tailscale-exit-policy-router-agent
    user: "0:${CONTROL_GID:-1000}"
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETGID
      - SETUID
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    tmpfs:
      - /var/run/tailscale:mode=0750,size=1m
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "0"
    environment:
      CATALOG_PATH: /etc/tailscale-exit-policy-router/catalog.json
      CONTROL_GID: ${CONTROL_GID:-1000}
      CONTROL_SOCKET: /run/tailscale-exit-policy-router/control.sock
      LISTEN_ADDRESS: :8443
      PASSWORD_HASH_FILE: /run/secrets/ui/password.bcrypt
      RECONCILE_INTERVAL: 30s
      RUNTIME_DIRECTORY: /run/tailscale-exit-policy-router
      PROTON_BROKER_SOCKET: /run/tailscale-exit-policy-router/proton.sock
      SECRETS_DIRECTORY: /run/secrets/proton
      START_TAILSCALED: "true"
      STATE_PATH: /var/lib/tailscale-exit-policy-router/desired.json
      TAILSCALE_INTERFACE: tailscale0
      TAILSCALE_PORT: ${HOST_TAILSCALE_UDP_PORT:-41641}
      TAILSCALE_STATE: /var/lib/tailscale/tailscaled.state
      TLS_CERT_FILE: /run/secrets/tls/tls.crt
      TLS_KEY_FILE: /run/secrets/tls/tls.key
      UNASSIGNED_POLICY: ${UNASSIGNED_POLICY:-block}
      DNS_FORWARDER: ${DNS_FORWARDER:-true}
      DNS_DEFAULT_SERVER: ${DNS_DEFAULT_SERVER:-9.9.9.9}
      DNS_KILL_SWITCH_DEFAULT: ${DNS_KILL_SWITCH_DEFAULT:-true}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-ntfy}
      ALERT_SOURCE: ${ALERT_SOURCE:-tailscale-exit-policy-router}
      WAN_INTERFACE: eth0
    volumes:
      - ./config:/etc/tailscale-exit-policy-router:ro
      - tailscale-state:/var/lib/tailscale
      - ./proton-configs:/run/secrets/proton:ro
      - ./state:/var/lib/tailscale-exit-policy-router
      - runtime:/run/tailscale-exit-policy-router
      - ./ui-auth:/run/secrets/ui:ro
      - ./tls:/run/secrets/tls:ro
    ports:
      - "${HOST_TAILSCALE_UDP_PORT:-41641}:${HOST_TAILSCALE_UDP_PORT:-41641}/udp"
      - "${HOST_BIND_IP:?Set HOST_BIND_IP in .env}:8443:8443/tcp"
    networks:
      - router-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--unix-socket", "/run/tailscale-exit-policy-router/control.sock", "http://localhost/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    depends_on:
      proton-broker:
        condition: service_healthy
    restart: unless-stopped

  proton-broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
      args:
        PROTON_CORE_VERSION: ${PROTON_CORE_VERSION:-5.6.20}
    image: local/tailscale-exit-policy-router-broker:${IMAGE_TAG:-dev}
    pull_policy: never
    container_name: tailscale-exit-policy-router-broker
    user: "65533:${CONTROL_GID:-1000}"
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    init: true
    tmpfs:
      - /tmp:mode=1777,size=16m,noexec,nosuid,nodev
      - /run/user/65533:mode=0700,uid=65533,gid=${CONTROL_GID:-1000},size=1m,noexec,nosuid,nodev
    environment:
      HOME: /var/lib/proton-broker
      LOGNAME: proton-broker
      PROTON_BROKER_SOCKET: /run/tailscale-exit-policy-router/proton.sock
      PROTON_LOADER_OVERRIDES: keyring=json
      USER: proton-broker
      XDG_CACHE_HOME: /var/lib/proton-broker/cache
      XDG_CONFIG_HOME: /var/lib/proton-broker/config
      XDG_RUNTIME_DIR: /run/tailscale-exit-policy-router/proton-runtime
    volumes:
      - ./config:/etc/tailscale-exit-policy-router
      - ./proton-configs:/run/secrets/proton
      - runtime:/run/tailscale-exit-policy-router
      - ./proton-broker-state:/var/lib/proton-broker
    networks:
      - router-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client,socket; c=http.client.HTTPConnection('localhost'); c.sock=socket.socket(socket.AF_UNIX); c.sock.connect('/run/tailscale-exit-policy-router/proton.sock'); c.request('GET','/healthz'); assert c.getresponse().status == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  router-net:
    driver: bridge
    internal: false

volumes:
  tailscale-state:
  # Sockets, the compiled ruleset, and transient WireGuard key material live in
  # memory only and are discarded when both containers stop.
  runtime:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=16m,mode=0770,uid=0,gid=${CONTROL_GID:-1000}"
