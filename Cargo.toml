[package]
name = "tailscale-exit-policy-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1.10"
hex = "0.4"
http-body-util = "0.1"
humantime = "2.3"
lettre = { version = "0.11", default-features = false, features = ["aws-lc-rs", "builder", "hostname", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
rand = "0.9"
# No bundled crypto: axum-server already brings rustls with aws-lc-rs, and two
# providers in one process leave rustls unable to choose a default.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
subtle = "2.6"
tempfile = "3.20"
tokio = { version = "1.45", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1.45", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "gateway-agent"
path = "src/bin/gateway-agent.rs"

[[bin]]
name = "gateway-ui"
path = "src/bin/gateway-ui.rs"